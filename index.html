<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Partition</title>
    <style>
      [role="toolbar"] { display: flex; flex-wrap: wrap; gap: 0.25rem; margin-bottom: 0.5rem; }
      [role="toolbar"] button { padding: 0.4rem 0.7rem; cursor: pointer; }
      [role="toolbar"] button[aria-pressed="true"] { background: #1d4ed8; color: #fff; font-weight: bold; }
      [role="toolbar"] { align-items: center; }
      [role="toolbar"] .setting { display: flex; align-items: center; gap: 0.3rem; margin-left: 0.5rem; }
      [role="toolbar"] select { padding: 0.35rem 0.4rem; }
      .staff { overflow-x: auto; cursor: crosshair; }
      .staff:focus-visible { outline: 3px solid #1d4ed8; outline-offset: 2px; }
      .hint { color: #555; }
      .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
